name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out the ondewo-vtsi-api submodule
        # Not `submodules: recursive` on the checkout above: ondewo-proto-compiler is an SSH remote no runner
        # can clone. ondewo-vtsi-api is public, but .gitmodules names it by its SSH URL too, so it is fetched
        # over HTTPS here. Without it `test:protos` fails: campaignsAndEvents.spec reads the pinned
        # events.proto to check the generated VtsiEvent enum against it (red since 2026-10-02).
        run: git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init src/ondewo-vtsi-api

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The repo is ~95% generated gRPC/protobuf stubs; coverage is gated on the HAND-WRITTEN surface
      # (the D18 Keycloak offline-token auth provider). The test compiles the TS provider + spec and runs
      # node's built-in test runner under c8 with a >=90% line-coverage gate.
      - name: Unit tests + >=90% coverage gate on hand-written code
        run: npm test

      # auth/offlineTokenProvider.{js,d.ts} are build outputs and are NOT committed (.gitignore says
      # why). This step is what generates them, so they are produced by CI rather than by hand. It is
      # not redundant with `npm test`: pretest compiles the provider WITHOUT --declaration, so only
      # this step exercises the .d.ts emit, which can fail on its own when an inferred type is not
      # portable.
      - name: Build the auth provider (declaration emit)
        run: npm run build:auth

      - name: Typecheck + run example mock tests
        run: |
          npm run typecheck:examples
          npm run test:examples

      # Specs that drive the GENERATED stubs (asterisk_version presence, the Campaigns / Events
      # services and their two server streams against an in-process server). They need no backend.
      - name: Generated-stub contract tests
        run: npm run test:protos
