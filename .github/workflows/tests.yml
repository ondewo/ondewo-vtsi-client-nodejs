name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit-tests:
    name: tests (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same matrix as ondewo-nlu-client-nodejs: 20 is the floor of the toolchain, 22 the current
        # LTS, 24 the newest release.
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm' # caches ~/.npm, keyed on package-lock.json

      # `npm ci`, never `npm install`: it installs exactly the lockfile and fails if package.json and
      # package-lock.json disagree, instead of silently re-resolving.
      - name: Install dependencies from the lockfile
        run: npm ci --no-audit --no-fund

      # The repo is ~95% generated gRPC/protobuf stubs; coverage is gated on the HAND-WRITTEN surface
      # (auth/offlineTokenProvider.ts and the auth/grpcChannel.ts TLS helper, 100% lines/branches/
      # functions). It also runs tests/releaseNotes.spec.ts. The TLS spec generates its test PKI with
      # the openssl CLI that the runner image ships.
      - name: Unit tests + 100% coverage gate on hand-written code
        run: npm test

      # auth/*.js and auth/*.d.ts are tsc output that is COMMITTED because the npm package ships them
      # (create_npm_package copies auth/). They are prettier- and eslint-ignored, so nothing reformats
      # them; regenerate them here and fail if the result differs from what was committed. This also
      # exercises the .d.ts emit, which pretest (no --declaration) does not.
      - name: Committed auth build artifacts match their source
        run: |
          npm run build:auth
          git diff --exit-code -- auth/

      - name: Typecheck + run example mock tests
        run: |
          npm run typecheck:examples
          npm run test:examples

      # tests/asteriskVersion.spec.ts drives the GENERATED projects_pb stub: AsteriskConfigs.asteriskVersion
      # must keep explicit presence (has/clear), so regenerating from a .proto without `optional` fails here.
      - name: Generated proto stubs keep the field presence the server relies on
        run: npm run test:protos
